<!-- Nouvelle tentative de publication de la Cuisine du Refuge -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Cuisine du Refuge</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #47375d;
      background: linear-gradient(145deg, #f5eaff, #fff5f0, #e9e1ff);
    }

    header {
      text-align: center;
      padding: 40px 15px 25px;
    }

    h1 {
      margin: 0;
      color: #784e9e;
      font-size: clamp(28px, 6vw, 45px);
    }

    header p { color: #806b91; }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 15px 18px 60px;
    }

.party {
  background: linear-gradient(145deg, #fff8ff, #f1e5ff, #ffeef6);
  border: 3px solid #d5a9e9;
  border-radius: 28px;
  padding: 28px;
  box-shadow: 0 12px 35px rgba(140, 85, 170, 0.22);
}
.party h2 {
  margin: 0 0 22px;
  color: #8754ad;
  font-size: 30px;
  text-align: center;
  text-shadow: 1px 2px 3px #e5c9f3;
}

  .info {
  background: linear-gradient(135deg, #fff9ee, #ffe9f5);
  border: 2px solid #f1c9df;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 25px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(174, 118, 157, 0.12);
}

  .role {
  background: linear-gradient(135deg, #ffffff, #fff4fc);
  border: 2px solid #e6c5ed;
  border-radius: 22px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 0 6px 18px rgba(151, 101, 174, 0.12);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.role:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(151, 101, 174, 0.2);
}

    .role h3 {
      margin: 0 0 7px;
      color: #77529c;
    }

    .ingredient {
      color: #7c7086;
      font-size: 14px;
    }

    .members {
      margin: 15px 0;
      min-height: 25px;
    }

    .member {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f3eafb;
      border-radius: 30px;
      padding: 6px 12px 6px 6px;
      margin: 4px;
    }

    .avatar {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #c5a2e5;
      color: white;
      font-weight: bold;
    }

    button {
      background: #9065b7;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #74499b; }

    button:disabled {
      background: #d4cadb;
      cursor: not-allowed;
    }

    .leave { background: #a77b8c; }

    .notice {
      font-size: 13px;
      text-align: center;
      color: #806b91;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      .party { padding: 17px; }
      button { width: 100%; }
    }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

</head>

<body>
  <header>
    <h1>🌸 La Cuisine du Refuge 🌸</h1>
    <p>Un soupçon de magie, beaucoup de gourmandise !</p>
  </header>

  <main>
    <section class="party">
      <h2>🍣 Soirée Sashimi</h2>

      <div class="info">
        <strong>50 préparations</strong>
        <p>Organisateur : Naethalia (exemple)</p>
        <p>Choisissez les postes correspondant à vos ingrédients.</p>
      </div>

<div id="discord-connexion" style="text-align:center; margin:20px 0;">
  <button id="btn-discord" type="button">
    💜 Se connecter avec Discord
  </button>
</div>

      <div id="roles"></div>

      <p class="notice">
        ✨ Version de démonstration : les inscriptions
        ne sont pas encore enregistrées sur Internet.
      </p>
    </section>
  </main>

  <script>

const SUPABASE_URL = "https://xfeehgjryuiiywfgmspg.supabase.co";
const SUPABASE_KEY = "sb_publishable_hEJv6qLlQfhtlDKmWT99Rw_cPB7XBlM";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    supabaseClient
  .from("soirees")
  .select("id, titre, recette, nombre_preparations, statut")
  .eq("id", 1)
  .single()
  .then(({ data, error }) => {
    if (error) {
      console.error("Erreur de lecture de la soirée :", error.message);
    } else {
      console.log("Soirée retrouvée dans Supabase :", data.titre);
    }
  });
    const currentUser = {
  id: "demo",
  name: "Connexion Discord..."
};
    // Un seul utilisateur fictif pour tester la page.
    supabaseClient.auth.getSession().then(({ data, error }) => {
  if (error) {
    console.error("Erreur de session Discord :", error.message);
    return;
  }

  console.log(
    "Session Discord :",
    data.session ? "Connectée 💜" : "Non connectée"
  );
});
    supabaseClient.auth.getSession().then(({ data }) => {
  console.log(
    "Autorisation Discord disponible :",
    data.session?.provider_token ? "Oui 💜" : "Non"
  );
});
    supabaseClient.auth.getSession().then(async ({ data }) => {
  const session = data.session;

  if (!session?.provider_token) return;

  const { data: profil, error } =
    await supabaseClient.functions.invoke("pseudo-discord-refuge", {
      body: {
        discordToken: session.provider_token
      }
    });

  if (error || profil?.error) {
    console.error("Erreur de récupération du pseudo Discord");
    return;
  }

  console.log("Pseudo du Refuge :", profil.pseudo);
      currentUser.name = profil.pseudo;
render();
});


    const roles = [
      {
        id: "starter",
        name: "👑 Starter",
        ingredient: "Pousses d'épice",
        limit: 1,
        members: []
      },
      {
        id: "poisson",
        name: "🐟 Poisson",
        ingredient: "Poisson au choix",
        limit: 1,
        members: []
      },
      {
        id: "riz",
        name: "🍚 Riz",
        ingredient: "Riz",
        limit: Infinity,
        members: []
      }
    ];

    function toggleRole(roleId) {
      const role = roles.find(r => r.id === roleId);
      if (!role) return;

      const index = role.members.findIndex(
        member => member.id === currentUser.id
      );

      if (index >= 0) {
        role.members.splice(index, 1);
      } else if (role.members.length < role.limit) {
        role.members.push(currentUser);
      }

      render();
    }

    function render() {
      const container = document.getElementById("roles");
      container.replaceChildren();

      for (const role of roles) {
        const joined = role.members.some(
          member => member.id === currentUser.id
        );

        const full = role.members.length >= role.limit;
        const card = document.createElement("div");
        card.className = "role";

        const title = document.createElement("h3");
        title.textContent = role.name;
        card.appendChild(title);

        const ingredient = document.createElement("p");
        ingredient.className = "ingredient";
        ingredient.textContent =
          "À apporter : " + role.ingredient;
        card.appendChild(ingredient);

        const places = document.createElement("p");
        places.textContent = role.limit === Infinity
          ? "Places illimitées"
          : role.members.length + " / " + role.limit + " place";
        card.appendChild(places);

        const members = document.createElement("div");
        members.className = "members";

        if (role.members.length === 0) {
          members.textContent = "Aucun inscrit pour le moment.";
        }

        for (const member of role.members) {
          const badge = document.createElement("span");
          badge.className = "member";

          const avatar = document.createElement("span");
          avatar.className = "avatar";
          avatar.textContent = member.name[0];

          const name = document.createElement("span");
          name.textContent = member.name;

          badge.append(avatar, name);
          members.appendChild(badge);
        }

        card.appendChild(members);

        const button = document.createElement("button");
        button.textContent = joined
          ? "Me désinscrire"
          : full
            ? "Poste complet"
            : "Choisir ce poste";

        button.disabled = full && !joined;
        if (joined) button.className = "leave";

        button.addEventListener("click", () => {
          toggleRole(role.id);
        });

        card.appendChild(button);
        container.appendChild(card);
      }
    }

    render();
    
document.getElementById("btn-discord").addEventListener("click", async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: "discord",
    options: {
      scopes: "identify email guilds.members.read",
      redirectTo: window.location.origin + window.location.pathname
    }
  });

  if (error) {
    alert("Impossible de se connecter à Discord : " + error.message);
  }
});

  </script>
</body>
</html>
